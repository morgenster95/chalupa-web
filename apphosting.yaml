# Nastavení pro Firebase App Hosting (https://firebase.google.com/docs/app-hosting/configure)
runConfig:
  minInstances: 0
  maxInstances: 2
  concurrency: 80
  cpu: 1
  memoryMiB: 512

env:
  # Adresa webu (po připojení vlastní domény ji změňte)
  - variable: SITE_URL
    value: https://ZMENTE-NA-VASI-ADRESU.web.app
  # Kdo se smí přihlásit do administrace (Google účty, oddělené čárkou)
  - variable: ADMIN_EMAILS
    value: vas.email@gmail.com
  # Odesílatel e-mailů (doména ověřená v Resendu)
  - variable: EMAIL_FROM
    value: "Chalupa pod Oborou <rezervace@vase-domena.cz>"

  # Veřejná konfigurace Firebase pro přihlášení Googlem (Nastavení projektu → Vaše aplikace)
  - variable: NEXT_PUBLIC_FIREBASE_API_KEY
    value: ZMENTE
  - variable: NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN
    value: ZMENTE.firebaseapp.com
  - variable: NEXT_PUBLIC_FIREBASE_PROJECT_ID
    value: ZMENTE
  - variable: NEXT_PUBLIC_FIREBASE_APP_ID
    value: ZMENTE

  # --- Tajné klíče (vytvoří se příkazem: firebase apphosting:secrets:set NAZEV) ---
  - variable: APP_SECRET
    secret: APP_SECRET
  - variable: CRON_SECRET
    secret: CRON_SECRET
  # Odkomentujte, až klíče vytvoříte (viz NASTAVENI.md):
  # - variable: RESEND_API_KEY
  #   secret: RESEND_API_KEY
  # - variable: STRIPE_SECRET_KEY
  #   secret: STRIPE_SECRET_KEY
  # - variable: STRIPE_WEBHOOK_SECRET
  #   secret: STRIPE_WEBHOOK_SECRET
  # - variable: NEXT_PUBLIC_TURNSTILE_SITE_KEY
  #   value: ZMENTE
  # - variable: TURNSTILE_SECRET_KEY
  #   secret: TURNSTILE_SECRET_KEY
